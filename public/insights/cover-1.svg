<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <!-- Grid -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#222" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Nodes and Lines -->
  <g stroke="#555" stroke-width="2" fill="none">
    <path d="M 200 300 Q 400 100 600 300 T 1000 300" stroke="#FFB100" stroke-width="4" />
    <path d="M 200 450 Q 500 600 800 450" />
    <path d="M 300 150 Q 600 50 900 200" />
    
    <line x1="600" y1="300" x2="800" y2="450" />
    <line x1="600" y1="300" x2="300" y2="150" />
  </g>
  
  <g fill="#0A0A0A" stroke="#FFB100" stroke-width="4">
    <circle cx="600" cy="300" r="30" />
    <circle cx="200" cy="300" r="15" />
    <circle cx="1000" cy="300" r="15" />
  </g>

  <g fill="#0A0A0A" stroke="#888" stroke-width="3">
    <circle cx="800" cy="450" r="20" />
    <circle cx="300" cy="150" r="20" />
    <circle cx="900" cy="200" r="15" />
  </g>
  
  <!-- Floating elements -->
  <circle cx="450" cy="200" r="3" fill="#FFB100" opacity="0.6"/>
  <circle cx="700" cy="400" r="4" fill="#888" opacity="0.4"/>
  <circle cx="850" cy="250" r="2" fill="#FFB100" opacity="0.8"/>
</svg>
