<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="dots10" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="2" fill="#222"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots10)"/>

  <!-- ERP System of Record: Solid Central Ledger Grid Block -->
  <g fill="#141414" stroke="#444" stroke-width="2">
    <rect x="240" y="220" width="280" height="190" rx="6"/>
    <line x1="240" y1="270" x2="520" y2="270" stroke="#333"/>
    <line x1="240" y1="320" x2="520" y2="320" stroke="#333"/>
    <line x1="240" y1="370" x2="520" y2="370" stroke="#333"/>
    <line x1="380" y1="220" x2="380" y2="410" stroke="#333"/>
  </g>

  <!-- AI OS System of Action: Dynamic Orbiting Loop & Vectors -->
  <g fill="none" stroke-linecap="round">
    <path d="M 520 270 C 680 270, 740 180, 880 180 C 1000 180, 1020 315, 880 315 C 700 315, 680 430, 880 430 C 980 430, 1020 370, 960 315" stroke="#FFB100" stroke-width="4"/>
    <path d="M 520 370 L 720 370 L 800 315" stroke="#FFB100" stroke-width="2" stroke-dasharray="6 6"/>
  </g>

  <!-- Nodes / Intersections -->
  <circle cx="380" cy="270" r="8" fill="#888"/>
  <circle cx="380" cy="370" r="8" fill="#888"/>
  <circle cx="520" cy="270" r="12" fill="#0A0A0A" stroke="#FFB100" stroke-width="3"/>
  <circle cx="880" cy="180" r="14" fill="#0A0A0A" stroke="#FFB100" stroke-width="3"/>
  <circle cx="880" cy="315" r="18" fill="#FFB100"/>
  <circle cx="880" cy="430" r="14" fill="#0A0A0A" stroke="#FFB100" stroke-width="3"/>

  <!-- Action Pulses -->
  <circle cx="680" cy="225" r="4" fill="#FFB100"/>
  <circle cx="780" cy="315" r="4" fill="#FFB100" opacity="0.8"/>
  <circle cx="880" cy="315" r="32" fill="none" stroke="#FFB100" stroke-width="1" opacity="0.3"/>
</svg>
