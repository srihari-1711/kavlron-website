<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid13" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid13)"/>

  <!-- Screen / Terminal Viewport Frame -->
  <g fill="#121212" stroke="#333" stroke-width="2">
    <rect x="220" y="140" width="760" height="380" rx="10"/>
    <line x1="220" y1="185" x2="980" y2="185" stroke="#252525"/>
    <circle cx="250" cy="162" r="5" fill="#444"/>
    <circle cx="270" cy="162" r="5" fill="#444"/>
    <circle cx="290" cy="162" r="5" fill="#444"/>
  </g>

  <!-- Legacy UI Rows & Data Fields -->
  <g fill="#1a1a1a" stroke="#2c2c2c" stroke-width="1.5">
    <rect x="260" y="215" width="220" height="28" rx="4"/>
    <rect x="510" y="215" width="430" height="28" rx="4"/>
    <rect x="260" y="265" width="340" height="28" rx="4"/>
    <rect x="630" y="265" width="310" height="28" rx="4"/>
    <rect x="260" y="315" width="680" height="70" rx="4"/>
    <rect x="260" y="415" width="180" height="35" rx="6" stroke="#444"/>
    <rect x="470" y="415" width="180" height="35" rx="6" stroke="#FFB100" stroke-width="2" fill="#18150f"/>
  </g>

  <!-- AI Agent Vision & Action Coordinates -->
  <!-- Bounding crosshair over field -->
  <g fill="none" stroke="#FFB100" stroke-width="2">
    <path d="M 500 210 L 510 210 L 510 220"/>
    <path d="M 950 210 L 940 210 L 940 220"/>
    <path d="M 500 248 L 510 248 L 510 238"/>
    <path d="M 950 248 L 940 248 L 940 238"/>
    
    <!-- Action cursor / pointer navigation vector -->
    <path d="M 720 460 L 560 432" stroke-dasharray="4 4" stroke-width="2"/>
    <polygon points="560,432 575,436 570,446" fill="#FFB100"/>
  </g>

  <!-- Pulse on the target interaction -->
  <circle cx="560" cy="432" r="16" fill="none" stroke="#FFB100" stroke-width="1.5" opacity="0.6"/>
  <circle cx="560" cy="432" r="28" fill="none" stroke="#FFB100" stroke-width="1" opacity="0.3"/>
</svg>

