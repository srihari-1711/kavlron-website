<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid14" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid14)"/>

  <!-- Left: Inflow Transactions Stream -->
  <g fill="#121212" stroke="#2c2c2c" stroke-width="1.5">
    <rect x="180" y="160" width="340" height="70" rx="8"/>
    <rect x="180" y="250" width="340" height="70" rx="8"/>
    <rect x="180" y="340" width="340" height="70" rx="8"/>
    <rect x="180" y="430" width="340" height="70" rx="8"/>
  </g>

  <!-- Left Transaction Rows Detail -->
  <g fill="#242424">
    <rect x="205" y="182" width="140" height="12" rx="3"/>
    <rect x="205" y="202" width="80" height="8" rx="2" fill="#3a3a3a"/>
    <rect x="420" y="185" width="75" height="18" rx="4" fill="#18150f" stroke="#FFB100" stroke-width="1.5"/>

    <rect x="205" y="272" width="160" height="12" rx="3"/>
    <rect x="205" y="292" width="90" height="8" rx="2" fill="#3a3a3a"/>
    <rect x="420" y="275" width="75" height="18" rx="4" fill="#18150f" stroke="#FFB100" stroke-width="1.5"/>

    <rect x="205" y="362" width="120" height="12" rx="3"/>
    <rect x="205" y="382" width="70" height="8" rx="2" fill="#3a3a3a"/>
    <rect x="420" y="365" width="75" height="18" rx="4" fill="#222"/>

    <rect x="205" y="452" width="150" height="12" rx="3"/>
    <rect x="205" y="472" width="85" height="8" rx="2" fill="#3a3a3a"/>
    <rect x="420" y="455" width="75" height="18" rx="4" fill="#18150f" stroke="#FFB100" stroke-width="1.5"/>
  </g>

  <!-- Reconciliation Bridge & Matching Logic -->
  <g fill="none" stroke="#FFB100" stroke-width="2">
    <!-- Connecting paths to central ledger -->
    <path d="M 520 195 L 610 195 L 670 270" stroke-dasharray="4 4"/>
    <path d="M 520 285 L 670 285"/>
    <path d="M 520 465 L 610 465 L 670 310" stroke-dasharray="4 4"/>
  </g>

  <!-- Right: Reconciled General Ledger Matrix -->
  <g fill="#121212" stroke="#333" stroke-width="2">
    <rect x="680" y="160" width="360" height="340" rx="10"/>
    <line x1="680" y1="215" x2="1040" y2="215" stroke="#252525"/>
    <rect x="710" y="180" width="160" height="14" rx="3" fill="#FFB100"/>
    <circle cx="1010" cy="187" r="6" fill="#FFB100"/>
  </g>

  <!-- Ledger Balanced Rows -->
  <g fill="#1d1d1d" stroke="#2c2c2c" stroke-width="1">
    <rect x="710" y="240" width="300" height="40" rx="6"/>
    <rect x="710" y="295" width="300" height="40" rx="6"/>
    <rect x="710" y="350" width="300" height="40" rx="6"/>
    <rect x="710" y="415" width="300" height="55" rx="6" fill="#18150f" stroke="#FFB100" stroke-width="1.5"/>
  </g>

  <!-- Check marks and balanced status -->
  <g fill="none" stroke="#FFB100" stroke-width="2">
    <path d="M 975 255 L 982 262 L 995 250"/>
    <path d="M 975 310 L 982 317 L 995 305"/>
    <path d="M 975 365 L 982 372 L 995 360"/>
  </g>
  <rect x="730" y="433" width="140" height="10" rx="2" fill="#FFB100"/>
  <rect x="730" y="450" width="80" height="8" rx="2" fill="#666"/>
</svg>

