<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid15" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid15)"/>

  <!-- Purchase Requisition Node (Step 1) -->
  <g fill="#121212" stroke="#2c2c2c" stroke-width="1.5">
    <rect x="140" y="210" width="220" height="210" rx="10"/>
    <rect x="165" y="235" width="110" height="14" rx="3" fill="#FFB100"/>
    <rect x="165" y="270" width="170" height="8" rx="2" fill="#333"/>
    <rect x="165" y="290" width="140" height="8" rx="2" fill="#333"/>
    <rect x="165" y="310" width="155" height="8" rx="2" fill="#333"/>
    <rect x="165" y="355" width="90" height="25" rx="5" fill="#18150f" stroke="#FFB100" stroke-width="1.5"/>
  </g>

  <!-- Flow Vector 1 -> 2 -->
  <path d="M 360 315 L 440 315" fill="none" stroke="#FFB100" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="440,315 430,310 430,320" fill="#FFB100"/>

  <!-- Multi-Vendor Quote Matrix (Step 2) -->
  <g fill="#121212" stroke="#333" stroke-width="2">
    <rect x="450" y="165" width="300" height="300" rx="10"/>
    <line x1="450" y1="215" x2="750" y2="215" stroke="#252525"/>
    <rect x="475" y="185" width="140" height="14" rx="3" fill="#fff" opacity="0.8"/>
  </g>

  <!-- Quote Comparison Columns -->
  <g fill="#181818" stroke="#2c2c2c" stroke-width="1">
    <rect x="475" y="235" width="250" height="60" rx="6"/>
    <rect x="475" y="310" width="250" height="60" rx="6" fill="#18150f" stroke="#FFB100" stroke-width="1.5"/>
    <rect x="475" y="385" width="250" height="60" rx="6"/>
  </g>
  <circle cx="700" cy="340" r="10" fill="#FFB100"/>
  <path d="M 696 340 L 699 343 L 705 337" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Flow Vector 2 -> 3 -->
  <path d="M 750 340 L 830 340" fill="none" stroke="#FFB100" stroke-width="2"/>
  <polygon points="830,340 820,335 820,345" fill="#FFB100"/>

  <!-- PO Dispatch & Delivery Tracking Node (Step 3) -->
  <g fill="#121212" stroke="#2c2c2c" stroke-width="1.5">
    <rect x="840" y="210" width="220" height="210" rx="10"/>
    <rect x="865" y="235" width="120" height="14" rx="3" fill="#FFB100"/>
    <rect x="865" y="270" width="170" height="8" rx="2" fill="#333"/>
    <rect x="865" y="295" width="150" height="8" rx="2" fill="#333"/>
    
    <!-- Status Progress Bar -->
    <rect x="865" y="340" width="170" height="12" rx="6" fill="#222"/>
    <rect x="865" y="340" width="120" height="12" rx="6" fill="#FFB100"/>
    <circle cx="985" cy="346" r="8" fill="#fff"/>
  </g>
</svg>

