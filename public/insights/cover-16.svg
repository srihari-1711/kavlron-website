<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid16" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid16)"/>

  <!-- Center: Master Employee Profile Node -->
  <g fill="#121212" stroke="#333" stroke-width="2">
    <rect x="440" y="150" width="320" height="330" rx="12"/>
    <circle cx="600" cy="225" r="35" fill="#1c1c1c" stroke="#444" stroke-width="2"/>
    <circle cx="600" cy="215" r="14" fill="#666"/>
    <path d="M 580 245 C 580 235 620 235 620 245" fill="none" stroke="#666" stroke-width="3"/>
    
    <!-- Profile metadata lines -->
    <rect x="520" y="280" width="160" height="14" rx="3" fill="#fff" opacity="0.85"/>
    <rect x="545" y="305" width="110" height="10" rx="2" fill="#FFB100"/>
    <rect x="480" y="340" width="240" height="8" rx="2" fill="#2a2a2a"/>
    <rect x="480" y="360" width="200" height="8" rx="2" fill="#2a2a2a"/>
    <rect x="480" y="380" width="220" height="8" rx="2" fill="#2a2a2a"/>
    <rect x="525" y="420" width="150" height="30" rx="6" fill="#18150f" stroke="#FFB100" stroke-width="1.5"/>
  </g>

  <!-- Left: Provisioning & Document Vault -->
  <g fill="#121212" stroke="#2c2c2c" stroke-width="1.5">
    <rect x="150" y="190" width="210" height="110" rx="8"/>
    <rect x="175" y="215" width="100" height="12" rx="2" fill="#FFB100"/>
    <rect x="175" y="240" width="140" height="8" rx="2" fill="#333"/>
    <rect x="175" y="258" width="110" height="8" rx="2" fill="#333"/>

    <rect x="150" y="330" width="210" height="110" rx="8"/>
    <rect x="175" y="355" width="90" height="12" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="175" y="380" width="150" height="8" rx="2" fill="#333"/>
    <rect x="175" y="398" width="120" height="8" rx="2" fill="#333"/>
  </g>

  <!-- Right: Routine Employee Request & Policy Node -->
  <g fill="#121212" stroke="#2c2c2c" stroke-width="1.5">
    <rect x="840" y="190" width="220" height="110" rx="8"/>
    <rect x="865" y="215" width="110" height="12" rx="2" fill="#FFB100"/>
    <rect x="865" y="240" width="150" height="8" rx="2" fill="#333"/>
    <circle cx="1025" cy="221" r="5" fill="#FFB100"/>

    <rect x="840" y="330" width="220" height="110" rx="8"/>
    <rect x="865" y="355" width="130" height="12" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="865" y="380" width="160" height="8" rx="2" fill="#333"/>
    <circle cx="1025" cy="361" r="5" fill="#444"/>
  </g>

  <!-- Connecting Data Vectors -->
  <g fill="none" stroke="#FFB100" stroke-width="1.5">
    <path d="M 360 245 L 440 280" stroke-dasharray="3 3"/>
    <path d="M 360 385 L 440 370" stroke-dasharray="3 3"/>
    <path d="M 760 280 L 840 245"/>
    <path d="M 760 370 L 840 385"/>
  </g>
</svg>

