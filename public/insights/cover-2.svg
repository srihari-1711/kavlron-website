<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="2" fill="#222"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots)" />

  <!-- Concentric orbits -->
  <g fill="none" stroke="#333" stroke-width="2">
    <ellipse cx="600" cy="315" rx="400" ry="200" transform="rotate(15 600 315)"/>
    <ellipse cx="600" cy="315" rx="400" ry="200" transform="rotate(-15 600 315)"/>
    <ellipse cx="600" cy="315" rx="250" ry="100" stroke="#FFB100" stroke-width="3" transform="rotate(45 600 315)"/>
  </g>

  <!-- Glowing core -->
  <circle cx="600" cy="315" r="40" fill="#FFB100" opacity="0.2" />
  <circle cx="600" cy="315" r="20" fill="#FFB100" />
  
  <!-- Satellites -->
  <g fill="#0A0A0A" stroke="#888" stroke-width="3">
    <circle cx="300" cy="230" r="15" stroke="#FFB100"/>
    <circle cx="900" cy="400" r="15" />
    <circle cx="750" cy="150" r="10" />
    <circle cx="450" cy="480" r="20" stroke="#FFB100" />
    <circle cx="250" cy="400" r="12" />
  </g>
</svg>
