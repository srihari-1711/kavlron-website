<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid20" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid20)"/>

  <!-- Left: The 3 Administrative Traps Draining Time -->
  <g fill="#121212" stroke="#2c2c2c" stroke-width="1.5">
    <!-- Drain 1: Chasing Approvals & Status -->
    <rect x="140" y="150" width="300" height="85" rx="8"/>
    <rect x="165" y="172" width="130" height="10" rx="2" fill="#fff" opacity="0.8"/>
    <rect x="165" y="195" width="200" height="8" rx="2" fill="#555"/>
    <circle cx="400" cy="192" r="10" fill="#222" stroke="#FFB100" stroke-width="1.5"/>

    <!-- Drain 2: Manual System Cross-Checking -->
    <rect x="140" y="270" width="300" height="85" rx="8"/>
    <rect x="165" y="292" width="140" height="10" rx="2" fill="#fff" opacity="0.8"/>
    <rect x="165" y="315" width="170" height="8" rx="2" fill="#555"/>
    <circle cx="400" cy="312" r="10" fill="#222" stroke="#FFB100" stroke-width="1.5"/>

    <!-- Drain 3: Re-Typing Data Across Screens -->
    <rect x="140" y="390" width="300" height="85" rx="8"/>
    <rect x="165" y="412" width="150" height="10" rx="2" fill="#fff" opacity="0.8"/>
    <rect x="165" y="435" width="180" height="8" rx="2" fill="#555"/>
    <circle cx="400" cy="432" r="10" fill="#222" stroke="#FFB100" stroke-width="1.5"/>
  </g>

  <!-- Flow Lines Channeling Released Hours to Core Output -->
  <g fill="none" stroke="#FFB100" stroke-width="2">
    <path d="M 440 192 L 530 192 L 600 270" stroke-dasharray="4 4"/>
    <path d="M 440 312 L 600 312"/>
    <path d="M 440 432 L 530 432 L 600 355" stroke-dasharray="4 4"/>
  </g>

  <!-- Right: Unlocked Operational Capacity Matrix -->
  <g fill="#121212" stroke="#333" stroke-width="2">
    <rect x="600" y="140" width="460" height="350" rx="12"/>
    <line x1="600" y1="205" x2="1060" y2="205" stroke="#252525"/>
    <rect x="630" y="167" width="190" height="14" rx="3" fill="#FFB100"/>
    <rect x="940" y="163" width="90" height="22" rx="4" fill="#18150f" stroke="#FFB100" stroke-width="1.5"/>
  </g>

  <!-- Capacity Visualization: Scaled Work Output (Without Headcount Expansion) -->
  <g fill="#181818" stroke="#282828" stroke-width="1">
    <rect x="630" y="230" width="400" height="65" rx="6"/>
    <rect x="630" y="310" width="400" height="65" rx="6" fill="#18150f" stroke="#FFB100" stroke-width="1.5"/>
    <rect x="630" y="390" width="400" height="75" rx="6"/>
  </g>

  <!-- Capacity Progress Bars -->
  <rect x="650" y="250" width="140" height="10" rx="2" fill="#fff" opacity="0.8"/>
  <rect x="650" y="270" width="360" height="10" rx="4" fill="#252525"/>
  <rect x="650" y="270" width="220" height="10" rx="4" fill="#666"/>

  <rect x="650" y="328" width="160" height="10" rx="2" fill="#FFB100"/>
  <rect x="650" y="348" width="360" height="12" rx="4" fill="#252525"/>
  <rect x="650" y="348" width="320" height="12" rx="4" fill="#FFB100"/>

  <rect x="650" y="410" width="180" height="10" rx="2" fill="#fff" opacity="0.8"/>
  <rect x="650" y="430" width="360" height="10" rx="4" fill="#252525"/>
  <rect x="650" y="430" width="280" height="10" rx="4" fill="#888"/>
</svg>

