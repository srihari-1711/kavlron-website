<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid21" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid21)"/>

  <!-- The 5 Quote-to-Cash Stages -->
  <!-- Main Conduit Pipeline -->
  <rect x="140" y="295" width="920" height="20" rx="10" fill="#181818" stroke="#333" stroke-width="1.5"/>

  <!-- Stage Nodes along the Conduit -->
  <!-- 1. Quote / Proposal -->
  <g fill="#121212" stroke="#2c2c2c" stroke-width="1.5">
    <rect x="130" y="170" width="160" height="90" rx="8"/>
    <rect x="150" y="190" width="90" height="10" rx="2" fill="#fff" opacity="0.8"/>
    <rect x="150" y="210" width="110" height="8" rx="2" fill="#555"/>
    <circle cx="210" cy="305" r="14" fill="#18150f" stroke="#FFB100" stroke-width="2"/>
    <circle cx="210" cy="305" r="5" fill="#FFB100"/>
  </g>

  <!-- 2. Contract Signing -->
  <g fill="#121212" stroke="#2c2c2c" stroke-width="1.5">
    <rect x="330" y="350" width="160" height="90" rx="8"/>
    <rect x="350" y="370" width="100" height="10" rx="2" fill="#fff" opacity="0.8"/>
    <rect x="350" y="390" width="110" height="8" rx="2" fill="#555"/>
    <circle cx="410" cy="305" r="14" fill="#18150f" stroke="#FFB100" stroke-width="2"/>
    <circle cx="410" cy="305" r="5" fill="#FFB100"/>
  </g>

  <!-- 3. Delivery & Fulfillment (Leakage Risk Area) -->
  <g fill="#18150f" stroke="#FFB100" stroke-width="1.5">
    <rect x="530" y="150" width="170" height="110" rx="8"/>
    <rect x="550" y="170" width="110" height="10" rx="2" fill="#FFB100"/>
    <rect x="550" y="190" width="130" height="8" rx="2" fill="#888"/>
    <rect x="550" y="215" width="120" height="22" rx="4" fill="#252015" stroke="#FFB100" stroke-width="1"/>
    <circle cx="615" cy="305" r="18" fill="#FFB100"/>
    <circle cx="615" cy="305" r="8" fill="#0A0A0A"/>
  </g>

  <!-- Leakage Visual Indicators (Drops falling between Delivery & Billing) -->
  <path d="M 615 325 L 615 385" stroke="#FFB100" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="615" cy="405" r="6" fill="#FFB100" opacity="0.8"/>
  <circle cx="615" cy="430" r="4" fill="#FFB100" opacity="0.4"/>

  <!-- 4. Invoicing & Billing -->
  <g fill="#121212" stroke="#2c2c2c" stroke-width="1.5">
    <rect x="730" y="350" width="160" height="90" rx="8"/>
    <rect x="750" y="370" width="90" height="10" rx="2" fill="#fff" opacity="0.8"/>
    <rect x="750" y="390" width="110" height="8" rx="2" fill="#555"/>
    <circle cx="810" cy="305" r="14" fill="#18150f" stroke="#FFB100" stroke-width="2"/>
    <circle cx="810" cy="305" r="5" fill="#FFB100"/>
  </g>

  <!-- 5. Renewal & Retainer -->
  <g fill="#121212" stroke="#2c2c2c" stroke-width="1.5">
    <rect x="910" y="170" width="160" height="90" rx="8"/>
    <rect x="930" y="190" width="110" height="10" rx="2" fill="#fff" opacity="0.8"/>
    <rect x="930" y="210" width="110" height="8" rx="2" fill="#555"/>
    <circle cx="990" cy="305" r="14" fill="#18150f" stroke="#FFB100" stroke-width="2"/>
    <circle cx="990" cy="305" r="5" fill="#FFB100"/>
  </g>

  <!-- Connecting Vector Across Pipeline -->
  <path d="M 210 305 L 990 305" fill="none" stroke="#FFB100" stroke-width="2"/>
</svg>

