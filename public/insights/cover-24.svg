<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid24" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid24)"/>

  <!-- Left: Task Inventory Audit Sheet -->
  <g fill="#121212" stroke="#2c2c2c" stroke-width="1.5">
    <rect x="150" y="140" width="420" height="350" rx="10"/>
    <line x1="150" y1="200" x2="570" y2="200" stroke="#222"/>
    <rect x="180" y="165" width="160" height="12" rx="3" fill="#666"/>
  </g>

  <!-- Inventory Rows -->
  <g fill="#181818" stroke="#222">
    <rect x="180" y="225" width="360" height="45" rx="6"/>
    <rect x="180" y="285" width="360" height="45" rx="6" fill="#18150f" stroke="#FFB100" stroke-width="1.5"/>
    <rect x="180" y="345" width="360" height="45" rx="6"/>
    <rect x="180" y="405" width="360" height="45" rx="6" fill="#18150f" stroke="#FFB100" stroke-width="1.5"/>
  </g>
  <rect x="200" y="242" width="140" height="10" rx="2" fill="#555"/>
  <circle cx="510" cy="247" r="6" fill="#333"/>

  <rect x="200" y="302" width="180" height="10" rx="2" fill="#FFB100"/>
  <circle cx="510" cy="307" r="7" fill="#FFB100"/>

  <rect x="200" y="362" width="120" height="10" rx="2" fill="#555"/>
  <circle cx="510" cy="367" r="6" fill="#333"/>

  <rect x="200" y="422" width="160" height="10" rx="2" fill="#FFB100"/>
  <circle cx="510" cy="427" r="7" fill="#FFB100"/>

  <!-- Connector Vector -->
  <path d="M 570 307 L 650 307" stroke="#FFB100" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="650,307 640,302 640,312" fill="#FFB100"/>

  <!-- Right: Unlocked Capacity Matrix -->
  <g fill="#121212" stroke="#333" stroke-width="2">
    <rect x="660" y="140" width="390" height="350" rx="12"/>
    <line x1="660" y1="205" x2="1050" y2="205" stroke="#252525"/>
    <rect x="690" y="167" width="180" height="14" rx="3" fill="#FFB100"/>
    <circle cx="1020" cy="174" r="6" fill="#FFB100"/>
  </g>

  <!-- Metric Gauges -->
  <g fill="#18150f" stroke="#FFB100" stroke-width="1.5">
    <rect x="690" y="235" width="330" height="65" rx="8"/>
    <rect x="690" y="320" width="330" height="65" rx="8"/>
    <rect x="690" y="405" width="330" height="60" rx="8"/>
  </g>
  <rect x="715" y="255" width="140" height="10" rx="2" fill="#fff" opacity="0.9"/>
  <rect x="715" y="272" width="200" height="8" rx="2" fill="#888"/>
  <rect x="940" y="252" width="60" height="22" rx="4" fill="#FFB100"/>

  <rect x="715" y="340" width="160" height="10" rx="2" fill="#fff" opacity="0.9"/>
  <rect x="715" y="357" width="180" height="8" rx="2" fill="#888"/>
  <rect x="940" y="337" width="60" height="22" rx="4" fill="#FFB100"/>

  <rect x="715" y="425" width="120" height="10" rx="2" fill="#FFB100"/>
  <circle cx="970" cy="435" r="8" fill="#FFB100"/>
</svg>

