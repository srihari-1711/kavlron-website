<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid25" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid25)"/>

  <!-- Inbound Lead Arrival Node -->
  <g fill="#121212" stroke="#2c2c2c" stroke-width="1.5">
    <rect x="140" y="210" width="220" height="210" rx="10"/>
    <rect x="165" y="235" width="110" height="14" rx="3" fill="#FFB100"/>
    <rect x="165" y="270" width="170" height="8" rx="2" fill="#333"/>
    <rect x="165" y="295" width="130" height="8" rx="2" fill="#333"/>
    <rect x="165" y="345" width="170" height="30" rx="5" fill="#18150f" stroke="#FFB100" stroke-width="1.5"/>
  </g>
  <circle cx="190" cy="360" r="6" fill="#FFB100"/>
  <rect x="210" y="355" width="90" height="10" rx="2" fill="#fff" opacity="0.9"/>

  <!-- Latency Gap / Time Decay Meter -->
  <g fill="#121212" stroke="#333" stroke-width="2">
    <circle cx="560" cy="315" r="95" fill="#141414"/>
    <circle cx="560" cy="315" r="95" fill="none" stroke="#282828" stroke-width="6"/>
    <!-- Quarter decay arc -->
    <path d="M 560 220 A 95 95 0 0 1 655 315" fill="none" stroke="#FFB100" stroke-width="6"/>
    
    <!-- Clock Hands -->
    <line x1="560" y1="315" x2="560" y2="250" stroke="#FFB100" stroke-width="3" stroke-linecap="round"/>
    <line x1="560" y1="315" x2="615" y2="315" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="560" cy="315" r="6" fill="#FFB100"/>
  </g>
  <rect x="500" y="440" width="120" height="22" rx="4" fill="#18150f" stroke="#FFB100" stroke-width="1"/>
  <rect x="515" y="447" width="90" height="8" rx="2" fill="#FFB100"/>

  <!-- Divergence Vectors -->
  <!-- Upper Vector: Immediate Response -> Closed Deal -->
  <path d="M 670 280 L 820 230" stroke="#FFB100" stroke-width="2"/>
  <polygon points="820,230 808,227 813,237" fill="#FFB100"/>

  <g fill="#18150f" stroke="#FFB100" stroke-width="1.5">
    <rect x="830" y="180" width="230" height="100" rx="8"/>
    <rect x="855" y="205" width="120" height="12" rx="2" fill="#FFB100"/>
    <rect x="855" y="230" width="160" height="8" rx="2" fill="#fff" opacity="0.8"/>
    <circle cx="1025" cy="211" r="7" fill="#FFB100"/>
  </g>

  <!-- Lower Vector: Delayed Response -> Cold Drop -->
  <path d="M 670 350 L 820 400" stroke="#333" stroke-width="2" stroke-dasharray="4 4"/>
  <polygon points="820,400 813,393 808,403" fill="#444"/>

  <g fill="#121212" stroke="#222" stroke-width="1">
    <rect x="830" y="350" width="230" height="100" rx="8"/>
    <rect x="855" y="375" width="100" height="10" rx="2" fill="#444"/>
    <rect x="855" y="400" width="140" height="8" rx="2" fill="#333"/>
    <circle cx="1025" cy="380" r="6" fill="#333"/>
  </g>
</svg>
