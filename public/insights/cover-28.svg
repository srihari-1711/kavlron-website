<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid28" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid28)"/>

  <!-- Left: Pre-Intervention Baseline (The "Before" Reading) -->
  <g fill="#121212" stroke="#2c2c2c" stroke-width="1.5">
    <rect x="140" y="150" width="420" height="340" rx="10"/>
    <line x1="140" y1="210" x2="560" y2="210" stroke="#222"/>
    <rect x="170" y="175" width="160" height="12" rx="3" fill="#666"/>
  </g>

  <!-- Baseline Metric Bars (Dim, High Latency/Cost) -->
  <g fill="#1a1a1a" stroke="#222">
    <rect x="170" y="235" width="360" height="65" rx="6"/>
    <rect x="170" y="315" width="360" height="65" rx="6"/>
    <rect x="170" y="395" width="360" height="65" rx="6"/>
  </g>
  <rect x="195" y="255" width="130" height="10" rx="2" fill="#555"/>
  <rect x="195" y="275" width="310" height="10" rx="3" fill="#444"/>

  <rect x="195" y="335" width="150" height="10" rx="2" fill="#555"/>
  <rect x="195" y="355" width="280" height="10" rx="3" fill="#444"/>

  <rect x="195" y="415" width="140" height="10" rx="2" fill="#555"/>
  <rect x="195" y="435" width="320" height="10" rx="3" fill="#444"/>

  <!-- Center Delta Comparator Tag -->
  <circle cx="600" cy="320" r="22" fill="#18150f" stroke="#FFB100" stroke-width="2"/>
  <path d="M 593 320 L 607 320 M 600 313 L 607 320 L 600 327" stroke="#FFB100" stroke-width="2" fill="none"/>

  <!-- Right: Post-Intervention Verified Outcome (The "After" Reading) -->
  <g fill="#121212" stroke="#333" stroke-width="2">
    <rect x="640" y="150" width="420" height="340" rx="10"/>
    <line x1="640" y1="210" x2="1060" y2="210" stroke="#252525"/>
    <rect x="670" y="175" width="180" height="12" rx="3" fill="#FFB100"/>
    <circle cx="1030" cy="181" r="6" fill="#FFB100"/>
  </g>

  <!-- Verified Outcome Metric Bars (Compressed Latency, Measured Output) -->
  <g fill="#18150f" stroke="#FFB100" stroke-width="1.5">
    <rect x="670" y="235" width="360" height="65" rx="6"/>
    <rect x="670" y="315" width="360" height="65" rx="6"/>
    <rect x="670" y="395" width="360" height="65" rx="6"/>
  </g>
  <rect x="695" y="255" width="140" height="10" rx="2" fill="#fff" opacity="0.9"/>
  <rect x="695" y="275" width="310" height="10" rx="3" fill="#252525"/>
  <rect x="695" y="275" width="80" height="10" rx="3" fill="#FFB100"/>
  <rect x="965" y="250" width="45" height="18" rx="3" fill="#FFB100"/>

  <rect x="695" y="335" width="160" height="10" rx="2" fill="#fff" opacity="0.9"/>
  <rect x="695" y="355" width="310" height="10" rx="3" fill="#252525"/>
  <rect x="695" y="355" width="65" height="10" rx="3" fill="#FFB100"/>
  <rect x="965" y="330" width="45" height="18" rx="3" fill="#FFB100"/>

  <rect x="695" y="415" width="150" height="10" rx="2" fill="#fff" opacity="0.9"/>
  <rect x="695" y="435" width="310" height="10" rx="3" fill="#252525"/>
  <rect x="695" y="435" width="95" height="10" rx="3" fill="#FFB100"/>
  <rect x="965" y="410" width="45" height="18" rx="3" fill="#FFB100"/>
</svg>

