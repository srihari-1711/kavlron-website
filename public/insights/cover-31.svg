<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid31" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid31)"/>

  <!-- Left: Fragmented Upstream Sources (Billing, ERP, Bank Feeds, Spreadsheets) -->
  <g fill="#141416" stroke="#25252a" stroke-width="1.5">
    <rect x="140" y="160" width="220" height="65" rx="8"/>
    <rect x="140" y="245" width="220" height="65" rx="8"/>
    <rect x="140" y="330" width="220" height="65" rx="8"/>
    <rect x="140" y="415" width="220" height="65" rx="8"/>
  </g>
  <rect x="165" y="180" width="100" height="10" rx="2" fill="#666"/>
  <rect x="165" y="198" width="140" height="8" rx="2" fill="#444"/>
  <rect x="165" y="265" width="120" height="10" rx="2" fill="#666"/>
  <rect x="165" y="283" width="90" height="8" rx="2" fill="#444"/>
  <rect x="165" y="350" width="110" height="10" rx="2" fill="#666"/>
  <rect x="165" y="368" width="130" height="8" rx="2" fill="#444"/>
  <rect x="165" y="435" width="95" height="10" rx="2" fill="#666"/>
  <rect x="165" y="453" width="115" height="8" rx="2" fill="#444"/>

  <!-- Feed Lines Converging on Center Close Matrix -->
  <path d="M 360 192 L 460 270" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M 360 277 L 460 300" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M 360 362 L 460 330" stroke="#333" stroke-width="1.5" fill="none"/>
  <path d="M 360 447 L 460 360" stroke="#333" stroke-width="1.5" fill="none"/>

  <!-- Center Close Reconciliation Matrix -->
  <g fill="#141416" stroke="#333" stroke-width="2">
    <rect x="460" y="180" width="320" height="270" rx="12"/>
    <line x1="460" y1="240" x2="780" y2="240" stroke="#252528"/>
    <rect x="485" y="202" width="160" height="14" rx="3" fill="#888"/>
  </g>
  <g fill="#1d1d22" stroke="#2a2a30">
    <rect x="485" y="260" width="270" height="35" rx="5"/>
    <rect x="485" y="310" width="270" height="35" rx="5"/>
    <rect x="485" y="360" width="270" height="35" rx="5"/>
  </g>
  <rect x="505" y="272" width="140" height="10" rx="2" fill="#666"/>
  <rect x="505" y="322" width="120" height="10" rx="2" fill="#666"/>
  <rect x="505" y="372" width="160" height="10" rx="2" fill="#666"/>
  <circle cx="730" cy="277" r="6" fill="#444"/>
  <circle cx="730" cy="327" r="6" fill="#444"/>
  <circle cx="730" cy="377" r="6" fill="#FFB100"/>

  <!-- Right: The 78% Post-Close Correction Re-open Loop -->
  <path d="M 780 277 C 880 277, 980 230, 980 180 C 980 130, 620 120, 620 178" stroke="#FFB100" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
  <polygon points="620,178 614,166 626,166" fill="#FFB100"/>

  <!-- Right Adjustment Notification Panel -->
  <g fill="#18150f" stroke="#FFB100" stroke-width="1.5">
    <rect x="850" y="260" width="210" height="110" rx="10"/>
  </g>
  <rect x="875" y="285" width="120" height="12" rx="3" fill="#FFB100"/>
  <rect x="875" y="308" width="160" height="8" rx="2" fill="#888"/>
  <rect x="875" y="324" width="110" height="8" rx="2" fill="#666"/>
  <circle cx="1035" cy="291" r="5" fill="#FFB100"/>
</svg>
