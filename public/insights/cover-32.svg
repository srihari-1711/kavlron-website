<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid32" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid32)"/>

  <!-- Main Container: Seller Weekly Capacity Gauge -->
  <g fill="#141416" stroke="#2c2c30" stroke-width="1.5">
    <rect x="140" y="140" width="920" height="350" rx="14"/>
    <line x1="140" y1="210" x2="1060" y2="210" stroke="#222"/>
    <rect x="175" y="168" width="160" height="14" rx="3" fill="#777"/>
  </g>

  <!-- Split Meter: 40% Selling vs 60% Non-Selling Administrative Drag -->
  <g fill="#18150f" stroke="#FFB100" stroke-width="2">
    <!-- 40% Selling Segment -->
    <rect x="175" y="240" width="340" height="110" rx="10"/>
  </g>
  <rect x="200" y="265" width="100" height="12" rx="3" fill="#FFB100"/>
  <rect x="200" y="290" width="180" height="30" rx="4" fill="#261e0e"/>
  <rect x="210" y="299" width="110" height="12" rx="2" fill="#FFB100"/>
  <circle cx="485" cy="271" r="6" fill="#FFB100"/>

  <!-- 60% Admin Drag Segment -->
  <g fill="#16161a" stroke="#333" stroke-width="1.5">
    <rect x="545" y="240" width="480" height="110" rx="10"/>
  </g>
  <rect x="575" y="265" width="130" height="12" rx="3" fill="#666"/>
  <rect x="575" y="290" width="420" height="16" rx="3" fill="#222"/>
  <rect x="575" y="315" width="350" height="12" rx="2" fill="#1d1d22"/>

  <!-- Lower Deconstruction: 3 Non-Selling Clerical Blocks -->
  <g fill="#1a1a20" stroke="#27272e" stroke-width="1.2">
    <rect x="175" y="380" width="270" height="75" rx="8"/>
    <rect x="470" y="380" width="270" height="75" rx="8"/>
    <rect x="765" y="380" width="260" height="75" rx="8"/>
  </g>
  <rect x="195" y="400" width="120" height="10" rx="2" fill="#555"/>
  <rect x="195" y="420" width="160" height="8" rx="2" fill="#3a3a42"/>

  <rect x="490" y="400" width="130" height="10" rx="2" fill="#555"/>
  <rect x="490" y="420" width="180" height="8" rx="2" fill="#3a3a42"/>

  <rect x="785" y="400" width="110" height="10" rx="2" fill="#555"/>
  <rect x="785" y="420" width="150" height="8" rx="2" fill="#3a3a42"/>
</svg>

