<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid33" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid33)"/>

  <!-- Main Workload Timeline Frame -->
  <g fill="#141416" stroke="#2c2c30" stroke-width="1.5">
    <rect x="140" y="140" width="920" height="350" rx="14"/>
    <line x1="140" y1="210" x2="1060" y2="210" stroke="#222"/>
    <rect x="175" y="168" width="180" height="14" rx="3" fill="#777"/>
  </g>

  <!-- Baseline Workload Line (Human Core Team Capacity Ceiling) -->
  <line x1="175" y1="360" x2="1025" y2="360" stroke="#444" stroke-width="2" stroke-dasharray="6 6"/>
  <rect x="175" y="338" width="150" height="16" rx="4" fill="#1f1f24"/>
  <rect x="185" y="343" width="110" height="6" rx="2" fill="#777"/>

  <!-- Volume Surge Curve (Peak Season Spike) -->
  <path d="M 175 420 Q 340 410, 440 370 Q 560 210, 680 210 Q 800 210, 880 380 Q 940 420, 1025 420" fill="none" stroke="#FFB100" stroke-width="3"/>

  <!-- Peak Area Elastic Buffer (Absorbed Automatically) -->
  <path d="M 460 360 Q 560 210, 680 210 Q 800 210, 870 360 Z" fill="#241a08" stroke="#FFB100" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Peak Season Surge Peak Indicator Node -->
  <circle cx="680" cy="210" r="24" fill="#18150f" stroke="#FFB100" stroke-width="2"/>
  <circle cx="680" cy="210" r="8" fill="#FFB100"/>

  <!-- Three Autonomous Absorption Modules below the surge -->
  <g fill="#18181e" stroke="#2f2f38" stroke-width="1.2">
    <rect x="360" y="390" width="180" height="70" rx="8"/>
    <rect x="560" y="390" width="180" height="70" rx="8"/>
    <rect x="760" y="390" width="180" height="70" rx="8"/>
  </g>
  <rect x="380" y="410" width="100" height="10" rx="2" fill="#FFB100"/>
  <rect x="380" y="430" width="130" height="8" rx="2" fill="#555"/>

  <rect x="580" y="410" width="110" height="10" rx="2" fill="#FFB100"/>
  <rect x="580" y="430" width="120" height="8" rx="2" fill="#555"/>

  <rect x="780" y="410" width="90" height="10" rx="2" fill="#FFB100"/>
  <rect x="780" y="430" width="140" height="8" rx="2" fill="#555"/>
</svg>

