<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid39" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid39)"/>

  <!-- Left: Inflow Demand Pipeline (Incoming Opportunities) -->
  <g fill="#141416" stroke="#2c2c30" stroke-width="1.5">
    <rect x="140" y="160" width="280" height="310" rx="12"/>
    <line x1="140" y1="220" x2="420" y2="220" stroke="#222"/>
    <rect x="165" y="185" width="120" height="12" rx="3" fill="#666"/>
  </g>
  <g fill="#1d1d22" stroke="#282830">
    <rect x="165" y="245" width="230" height="38" rx="6"/>
    <rect x="165" y="295" width="230" height="38" rx="6"/>
    <rect x="165" y="345" width="230" height="38" rx="6"/>
    <rect x="165" y="395" width="230" height="38" rx="6"/>
  </g>
  <rect x="180" y="258" width="100" height="10" rx="2" fill="#888"/>
  <rect x="180" y="308" width="130" height="10" rx="2" fill="#888"/>
  <rect x="180" y="358" width="90" height="10" rx="2" fill="#888"/>
  <rect x="180" y="408" width="120" height="10" rx="2" fill="#888"/>

  <!-- Central Capacity Ceiling Barrier -->
  <line x1="480" y1="315" x2="720" y2="315" stroke="#FFB100" stroke-width="2.5" stroke-dasharray="6 4"/>
  <rect x="520" y="290" width="160" height="24" rx="4" fill="#1f180c" stroke="#FFB100" stroke-width="1"/>
  <rect x="540" y="298" width="120" height="8" rx="2" fill="#FFB100"/>

  <!-- Upper Accepted Stream (Constrained Throughput) -->
  <path d="M 420 260 C 480 260, 520 220, 760 220" fill="none" stroke="#FFB100" stroke-width="2.5"/>
  <g fill="#18150f" stroke="#FFB100" stroke-width="1.5">
    <rect x="760" y="175" width="300" height="90" rx="10"/>
  </g>
  <rect x="785" y="200" width="140" height="12" rx="3" fill="#FFB100"/>
  <rect x="785" y="224" width="180" height="8" rx="2" fill="#888"/>
  <circle cx="1025" cy="206" r="6" fill="#FFB100"/>

  <!-- Lower Deflected / Turned Away Work Stream (Invisible Revenue Loss) -->
  <path d="M 420 370 C 500 370, 540 430, 760 430" fill="none" stroke="#444" stroke-width="2" stroke-dasharray="6 6"/>
  <g fill="#121214" stroke="#222" stroke-width="1.5">
    <rect x="760" y="380" width="300" height="90" rx="10"/>
  </g>
  <rect x="785" y="405" width="130" height="12" rx="3" fill="#555"/>
  <rect x="785" y="429" width="160" height="8" rx="2" fill="#333"/>
  <line x1="1005" y1="410" x2="1035" y2="440" stroke="#662222" stroke-width="2"/>
  <line x1="1035" y1="410" x2="1005" y2="440" stroke="#662222" stroke-width="2"/>
</svg>
