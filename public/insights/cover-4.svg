<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <!-- Wave pattern -->
  <g stroke="#222" stroke-width="2" fill="none">
    <path d="M 0 100 Q 300 200 600 100 T 1200 100" />
    <path d="M 0 200 Q 300 300 600 200 T 1200 200" />
    <path d="M 0 300 Q 300 400 600 300 T 1200 300" />
    <path d="M 0 400 Q 300 500 600 400 T 1200 400" />
    <path d="M 0 500 Q 300 600 600 500 T 1200 500" />
  </g>

  <!-- Central alignment axis -->
  <line x1="600" y1="0" x2="600" y2="630" stroke="#FFB100" stroke-width="4" stroke-dasharray="15 10"/>
  
  <!-- Nodes snapping to axis -->
  <g fill="#0A0A0A" stroke="#888" stroke-width="3">
    <circle cx="300" cy="250" r="15" />
    <circle cx="900" cy="350" r="15" />
    <circle cx="450" cy="450" r="15" />
  </g>

  <!-- Highlighted axis nodes -->
  <g fill="#0A0A0A" stroke="#FFB100" stroke-width="4">
    <circle cx="600" cy="150" r="20" />
    <circle cx="600" cy="350" r="25" fill="#FFB100" opacity="0.1"/>
    <circle cx="600" cy="350" r="25" />
    <circle cx="600" cy="550" r="20" />
  </g>

  <line x1="300" y1="250" x2="600" y2="350" stroke="#FFB100" stroke-width="2" />
  <line x1="900" y1="350" x2="600" y2="350" stroke="#FFB100" stroke-width="2" />
</svg>
