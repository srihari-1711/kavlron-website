<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid41" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid41)"/>

  <!-- Left: Traditional Operating Cost Structure (High Admin Overhead Burden) -->
  <g fill="#141416" stroke="#2c2c30" stroke-width="1.5">
    <rect x="140" y="150" width="380" height="340" rx="12"/>
    <line x1="140" y1="215" x2="520" y2="215" stroke="#222"/>
    <rect x="170" y="176" width="160" height="14" rx="3" fill="#666"/>
  </g>
  <!-- Client Delivery Core (Untouched, High Quality) -->
  <rect x="170" y="240" width="320" height="85" rx="8" fill="#1f180c" stroke="#FFB100" stroke-width="1.5"/>
  <rect x="195" y="260" width="160" height="12" rx="3" fill="#FFB100"/>
  <rect x="195" y="284" width="220" height="8" rx="2" fill="#888"/>

  <!-- Administrative Overhead Wedge (The Drain to be Trimmed) -->
  <rect x="170" y="345" width="320" height="115" rx="8" fill="#1b1b20" stroke="#333"/>
  <rect x="195" y="365" width="140" height="10" rx="2" fill="#666"/>
  <rect x="195" y="388" width="260" height="8" rx="2" fill="#444"/>
  <rect x="195" y="408" width="200" height="8" rx="2" fill="#333"/>
  <rect x="195" y="428" width="180" height="8" rx="2" fill="#292929"/>

  <!-- Center Transformation Arrow -->
  <circle cx="590" cy="320" r="24" fill="#18150f" stroke="#FFB100" stroke-width="2"/>
  <path d="M 580 320 L 600 320 M 593 313 L 600 320 L 593 327" stroke="#FFB100" stroke-width="2" fill="none"/>

  <!-- Right: Optimized Lean Operating Structure -->
  <g fill="#141416" stroke="#333" stroke-width="2">
    <rect x="660" y="150" width="400" height="340" rx="12"/>
    <line x1="660" y1="215" x2="1060" y2="215" stroke="#252528"/>
    <rect x="690" y="176" width="180" height="14" rx="3" fill="#FFB100"/>
    <circle cx="1030" cy="183" r="6" fill="#FFB100"/>
  </g>
  <!-- Full Client Delivery Capacity Preserved & Expanded -->
  <rect x="690" y="240" width="340" height="140" rx="8" fill="#1f180c" stroke="#FFB100" stroke-width="2"/>
  <rect x="715" y="265" width="180" height="14" rx="3" fill="#FFB100"/>
  <rect x="715" y="295" width="280" height="10" rx="2" fill="#FFB100"/>
  <rect x="715" y="315" width="240" height="8" rx="2" fill="#888"/>
  <rect x="715" y="335" width="210" height="8" rx="2" fill="#666"/>

  <!-- Minimized, Automated Overhead Layer -->
  <rect x="690" y="400" width="340" height="60" rx="8" fill="#141418" stroke="#282830"/>
  <rect x="715" y="418" width="140" height="10" rx="2" fill="#555"/>
  <rect x="715" y="436" width="220" height="6" rx="1" fill="#333"/>
  <circle cx="1005" cy="430" r="4" fill="#FFB100"/>
</svg>
