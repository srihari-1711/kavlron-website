<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid42" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid42)"/>

  <!-- Left: Cold / Dormant Opportunity Archive -->
  <g fill="#141416" stroke="#25252c" stroke-width="1.5">
    <rect x="140" y="160" width="300" height="320" rx="12"/>
    <line x1="140" y1="220" x2="440" y2="220" stroke="#222"/>
    <rect x="165" y="185" width="130" height="12" rx="3" fill="#555"/>
  </g>
  <!-- Inactive / Stalled Deal Cards -->
  <g fill="#191920" stroke="#222">
    <rect x="165" y="240" width="250" height="42" rx="6"/>
    <rect x="165" y="295" width="250" height="42" rx="6"/>
    <rect x="165" y="350" width="250" height="42" rx="6"/>
    <rect x="165" y="405" width="250" height="42" rx="6"/>
  </g>
  <rect x="180" y="255" width="120" height="8" rx="2" fill="#444"/>
  <rect x="180" y="310" width="140" height="8" rx="2" fill="#444"/>
  <rect x="180" y="365" width="110" height="8" rx="2" fill="#444"/>
  <rect x="180" y="420" width="130" height="8" rx="2" fill="#444"/>

  <!-- Central Intelligence Reactivation Probe -->
  <path d="M 440 260 C 530 260, 530 320, 610 320" fill="none" stroke="#FFB100" stroke-width="2.5"/>
  <g fill="#18150f" stroke="#FFB100" stroke-width="2">
    <circle cx="610" cy="320" r="48"/>
  </g>
  <circle cx="610" cy="320" r="16" fill="#FFB100"/>
  <path d="M 602 320 L 618 320 M 610 312 L 610 328" stroke="#0A0A0A" stroke-width="2.5"/>

  <!-- Pulse rings radiating from probe -->
  <circle cx="610" cy="320" r="70" fill="none" stroke="#FFB100" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Right: Reactivated Sales Channel & Rep Handback -->
  <path d="M 658 320 C 720 320, 740 240, 800 240" fill="none" stroke="#FFB100" stroke-width="2.5"/>
  
  <g fill="#16161a" stroke="#FFB100" stroke-width="2">
    <rect x="800" y="180" width="260" height="120" rx="10"/>
  </g>
  <rect x="825" y="205" width="140" height="12" rx="3" fill="#FFB100"/>
  <rect x="825" y="228" width="190" height="8" rx="2" fill="#888"/>
  <rect x="825" y="246" width="160" height="8" rx="2" fill="#666"/>
  <circle cx="1025" cy="211" r="6" fill="#FFB100"/>

  <!-- Lower Action: Account Executive Active Handoff Card -->
  <path d="M 658 320 C 720 320, 740 400, 800 400" fill="none" stroke="#FFB100" stroke-width="2"/>
  <g fill="#1f180c" stroke="#FFB100" stroke-width="1.5">
    <rect x="800" y="340" width="260" height="120" rx="10"/>
  </g>
  <rect x="825" y="365" width="130" height="12" rx="3" fill="#FFB100"/>
  <rect x="825" y="388" width="170" height="8" rx="2" fill="#888"/>
  <rect x="825" y="406" width="140" height="8" rx="2" fill="#555"/>
  <circle cx="1025" cy="425" r="8" fill="#FFB100"/>
</svg>
