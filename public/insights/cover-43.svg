<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid43" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid43)"/>

  <!-- High-Volume Parallel Lanes (Volume expanding 3x) -->
  <!-- Lane 1 -->
  <line x1="140" y1="210" x2="1060" y2="210" stroke="#252528" stroke-width="2"/>
  <!-- Lane 2 (Central Active Route) -->
  <line x1="140" y1="315" x2="1060" y2="315" stroke="#FFB100" stroke-width="2.5"/>
  <!-- Lane 3 -->
  <line x1="140" y1="420" x2="1060" y2="420" stroke="#252528" stroke-width="2"/>

  <!-- Throughput Packets along Lane 1 -->
  <rect x="220" y="195" width="60" height="30" rx="4" fill="#18181e" stroke="#333"/>
  <rect x="440" y="195" width="60" height="30" rx="4" fill="#18181e" stroke="#333"/>
  <rect x="740" y="195" width="60" height="30" rx="4" fill="#18181e" stroke="#333"/>
  <rect x="940" y="195" width="60" height="30" rx="4" fill="#18181e" stroke="#333"/>

  <!-- Throughput Packets along Lane 2 (Golden Active Flow) -->
  <rect x="180" y="300" width="70" height="30" rx="4" fill="#1f180c" stroke="#FFB100" stroke-width="1.5"/>
  <rect x="420" y="300" width="70" height="30" rx="4" fill="#1f180c" stroke="#FFB100" stroke-width="1.5"/>
  <rect x="720" y="300" width="70" height="30" rx="4" fill="#1f180c" stroke="#FFB100" stroke-width="1.5"/>
  <rect x="920" y="300" width="70" height="30" rx="4" fill="#1f180c" stroke="#FFB100" stroke-width="1.5"/>

  <!-- Throughput Packets along Lane 3 -->
  <rect x="260" y="405" width="60" height="30" rx="4" fill="#18181e" stroke="#333"/>
  <rect x="480" y="405" width="60" height="30" rx="4" fill="#18181e" stroke="#333"/>
  <rect x="780" y="405" width="60" height="30" rx="4" fill="#18181e" stroke="#333"/>
  <rect x="980" y="405" width="60" height="30" rx="4" fill="#18181e" stroke="#333"/>

  <!-- Standardized Quality Control Gates (Gate A & Gate B) -->
  <!-- Quality Gate A (Input & Spec Validation) -->
  <g fill="#141416" stroke="#FFB100" stroke-width="2">
    <rect x="330" y="150" width="60" height="330" rx="8"/>
  </g>
  <circle cx="360" cy="210" r="8" fill="#FFB100"/>
  <circle cx="360" cy="315" r="10" fill="#FFB100"/>
  <circle cx="360" cy="420" r="8" fill="#FFB100"/>

  <!-- Quality Gate B (Pre-Delivery Verification Gate) -->
  <g fill="#141416" stroke="#FFB100" stroke-width="2">
    <rect x="620" y="150" width="60" height="330" rx="8"/>
  </g>
  <circle cx="650" cy="210" r="8" fill="#FFB100"/>
  <circle cx="650" cy="315" r="10" fill="#FFB100"/>
  <circle cx="650" cy="420" r="8" fill="#FFB100"/>

  <!-- Output Delivery Node (High Fidelity Guaranteed) -->
  <g fill="#18150f" stroke="#FFB100" stroke-width="2">
    <circle cx="1060" cy="315" r="32"/>
  </g>
  <circle cx="1060" cy="315" r="10" fill="#FFB100"/>
  <path d="M 1053 315 L 1058 320 L 1068 310" stroke="#0A0A0A" stroke-width="2" fill="none"/>
</svg>
