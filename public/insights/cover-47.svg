<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid47" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid47)"/>

  <!-- Left: Existing Client Account Master (Historical Telemetry & Invoices) -->
  <g fill="#141416" stroke="#2c2c30" stroke-width="1.5">
    <rect x="140" y="180" width="260" height="270" rx="12"/>
    <line x1="140" y1="240" x2="400" y2="240" stroke="#222"/>
    <rect x="165" y="205" width="130" height="12" rx="3" fill="#666"/>
  </g>
  <!-- Client Historical Records -->
  <g fill="#1b1b22" stroke="#25252c">
    <rect x="165" y="260" width="210" height="42" rx="6"/>
    <rect x="165" y="315" width="210" height="42" rx="6"/>
    <rect x="165" y="370" width="210" height="42" rx="6"/>
  </g>
  <rect x="180" y="274" width="110" height="8" rx="2" fill="#888"/>
  <rect x="180" y="288" width="140" height="6" rx="1" fill="#444"/>

  <rect x="180" y="329" width="120" height="8" rx="2" fill="#888"/>
  <rect x="180" y="343" width="100" height="6" rx="1" fill="#444"/>

  <rect x="180" y="384" width="90" height="8" rx="2" fill="#888"/>
  <rect x="180" y="398" width="130" height="6" rx="1" fill="#444"/>

  <!-- Central Intelligence Radar & Account Signal Processor -->
  <path d="M 400 315 L 500 315" stroke="#FFB100" stroke-width="2.5" fill="none"/>
  <polygon points="490,309 500,315 490,321" fill="#FFB100"/>

  <g fill="#18150f" stroke="#FFB100" stroke-width="2">
    <circle cx="600" cy="315" r="75"/>
    <circle cx="600" cy="315" r="45" stroke-dasharray="4 4"/>
    <circle cx="600" cy="315" r="15" fill="#FFB100"/>
  </g>
  <!-- Sweeping Radar Beam -->
  <line x1="600" y1="315" x2="655" y2="260" stroke="#FFB100" stroke-width="2"/>
  <polygon points="655,260 635,262 650,277" fill="#FFB100"/>

  <!-- Right: Automated Opportunity Framing & Commercial Trigger -->
  <path d="M 700 315 L 800 315" stroke="#FFB100" stroke-width="2.5" fill="none"/>
  <polygon points="790,309 800,315 790,321" fill="#FFB100"/>

  <g fill="#18150f" stroke="#FFB100" stroke-width="2">
    <rect x="800" y="180" width="260" height="270" rx="12"/>
    <line x1="800" y1="240" x2="1060" y2="240" stroke="#2d220e"/>
  </g>
  <rect x="825" y="205" width="150" height="14" rx="3" fill="#FFB100"/>
  <circle cx="1025" cy="211" r="6" fill="#FFB100"/>

  <!-- Recommended Upsell Proposition Cards -->
  <g fill="#211a0e" stroke="#3a2e14">
    <rect x="825" y="260" width="210" height="75" rx="8"/>
    <rect x="825" y="350" width="210" height="75" rx="8"/>
  </g>
  <!-- Card 1: Add-on Capacity Expansion -->
  <rect x="845" y="276" width="130" height="10" rx="2" fill="#FFB100"/>
  <rect x="845" y="296" width="170" height="6" rx="1" fill="#888"/>
  <rect x="845" y="310" width="110" height="6" rx="1" fill="#555"/>
  <circle cx="1015" cy="281" r="5" fill="#FFB100"/>

  <!-- Card 2: Complementary Workflow Cross-Sell -->
  <rect x="845" y="366" width="140" height="10" rx="2" fill="#FFB100"/>
  <rect x="845" y="386" width="150" height="6" rx="1" fill="#888"/>
  <rect x="845" y="400" width="120" height="6" rx="1" fill="#555"/>
  <circle cx="1015" cy="371" r="5" fill="#FFB100"/>
</svg>
