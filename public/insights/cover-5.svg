<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <!-- Radial grid -->
  <g stroke="#1A1A1A" stroke-width="2" fill="none">
    <circle cx="600" cy="315" r="100" />
    <circle cx="600" cy="315" r="200" />
    <circle cx="600" cy="315" r="300" />
    <circle cx="600" cy="315" r="400" />
    <circle cx="600" cy="315" r="500" />
  </g>

  <!-- Pulsing core -->
  <circle cx="600" cy="315" r="60" fill="#FFB100" opacity="0.1" />
  <circle cx="600" cy="315" r="40" fill="#FFB100" opacity="0.3" />
  <circle cx="600" cy="315" r="20" fill="#FFB100" />

  <!-- Data streams -->
  <g stroke="#FFB100" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 600 315 L 600 115" stroke-dasharray="10 20" />
    <path d="M 600 315 L 800 315" stroke-dasharray="15 15" />
    <path d="M 600 315 L 458 456" stroke-dasharray="5 10" />
    <path d="M 600 315 L 400 315" stroke-dasharray="20 10" />
  </g>

  <!-- Outlying data points -->
  <g fill="#0A0A0A" stroke="#555" stroke-width="3">
    <circle cx="600" cy="115" r="12" stroke="#FFB100"/>
    <circle cx="800" cy="315" r="15" />
    <circle cx="458" cy="456" r="10" />
    <circle cx="400" cy="315" r="12" />
  </g>
</svg>
