<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid50" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid50)"/>

  <!-- Left Side: Public AI API Route (External / Multi-Tenant) -->
  <g fill="#141416" stroke="#ef4444" stroke-width="1.5">
    <rect x="100" y="140" width="450" height="360" rx="12"/>
    <line x1="100" y1="205" x2="550" y2="205" stroke="#ef4444" stroke-opacity="0.3"/>
    
    <text x="130" y="180" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Public Cloud API Processing</text>
    <text x="495" y="180" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="12">Shared Edge</text>
    
    <g transform="translate(125, 230)" fill="#1b1b22" stroke="#2e2e38" stroke-width="1">
      <rect width="400" height="65" rx="6"/>
      <text x="16" y="26" fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">1. Data Exits Corporate Perimeter</text>
      <text x="16" y="48" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11">Payload traverses public internet over commercial TLS</text>
    </g>

    <g transform="translate(125, 310)" fill="#1b1b22" stroke="#2e2e38" stroke-width="1">
      <rect width="400" height="65" rx="6"/>
      <text x="16" y="26" fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">2. Provider Ingestion &amp; Diagnostic Logging</text>
      <text x="16" y="48" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11">Prompts cached in multi-tenant API telemetry queues</text>
    </g>

    <g transform="translate(125, 390)" fill="#1b1b22" stroke="#2e2e38" stroke-width="1">
      <rect width="400" height="65" rx="6"/>
      <text x="16" y="26" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">3. Governance &amp; Compliance Drift Risk</text>
      <text x="16" y="48" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11">Jurisdiction dependency; audit trail outside customer control</text>
    </g>
  </g>

  <!-- Right Side: Private Infrastructure AI (Dedicated / Sovereign) -->
  <g fill="#141416" stroke="#10b981" stroke-width="1.5">
    <rect x="650" y="140" width="450" height="360" rx="12"/>
    <line x1="650" y1="205" x2="1100" y2="205" stroke="#10b981" stroke-opacity="0.3"/>
    
    <text x="680" y="180" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Private Enterprise Model Deployment</text>
    <text x="1030" y="180" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="12">VPC / On-Prem</text>
    
    <g transform="translate(675, 230)" fill="#1b1b22" stroke="#2e2e38" stroke-width="1">
      <rect width="400" height="65" rx="6"/>
      <text x="16" y="26" fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">1. Zero Egress Outside Corporate Boundary</text>
      <text x="16" y="48" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11">Documents stay inside customer VPC or internal servers</text>
    </g>

    <g transform="translate(675, 310)" fill="#1b1b22" stroke="#2e2e38" stroke-width="1">
      <rect width="400" height="65" rx="6"/>
      <text x="16" y="26" fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">2. Complete Telemetry Ownership</text>
      <text x="16" y="48" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11">Internal logs, KMS customer keys, zero external retention</text>
    </g>

    <g transform="translate(675, 390)" fill="#1b1b22" stroke="#2e2e38" stroke-width="1">
      <rect width="400" height="65" rx="6"/>
      <text x="16" y="26" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">3. Verifiable Compliance Guarantee</text>
      <text x="16" y="48" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11">Guaranteed GDPR, PDPA, and ISO compliance by design</text>
    </g>
  </g>
  
  <text x="600" y="325" fill="#52525b" font-family="system-ui, -apple-system, sans-serif" font-size="16" text-anchor="middle" font-weight="bold">VS</text>
</svg>