<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid51" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid51)"/>

  <!-- Top: The Consumer Subscription Trap -->
  <g fill="#141416" stroke="#27272a" stroke-width="1.5">
    <rect x="120" y="130" width="960" height="180" rx="10"/>
    <text x="150" y="165" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Consumer Seat-License / Token Meter Model</text>
    
    <!-- Flow showing failure under load -->
    <g transform="translate(150, 190)">
      <rect width="200" height="85" rx="6" fill="#1c1c22" stroke="#3f3f46"/>
      <text x="16" y="28" fill="#e4e4e7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Normal Business Load</text>
      <text x="16" y="50" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11">Individual chat requests</text>
      <text x="16" y="68" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11">20 req / min [OK]</text>
    </g>

    <path d="M 365 232 L 415 232" stroke="#52525b" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(430, 190)">
      <rect width="220" height="85" rx="6" fill="#221818" stroke="#ef4444"/>
      <text x="16" y="28" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Peak Month-End Surge</text>
      <text x="16" y="50" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="11">1,200 invoices to process</text>
      <text x="16" y="68" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="11">HTTP 429 Rate Exceeded</text>
    </g>

    <path d="M 665 232 L 715 232" stroke="#ef4444" stroke-width="2"/>

    <g transform="translate(730, 190)">
      <rect width="220" height="85" rx="6" fill="#1c1c22" stroke="#3f3f46"/>
      <text x="16" y="28" fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500">Operational Bottleneck</text>
      <text x="16" y="50" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11">Batch jobs halt mid-flight</text>
      <text x="16" y="68" fill="#eab308" font-family="system-ui, -apple-system, sans-serif" font-size="11">Manual fallback required</text>
    </g>
  </g>

  <!-- Bottom: Enterprise Implementation Architecture -->
  <g fill="#141416" stroke="#27272a" stroke-width="1.5">
    <rect x="120" y="340" width="960" height="200" rx="10"/>
    <text x="150" y="375" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Engineered Operational System Architecture</text>

    <!-- Resilient Queue Pipeline -->
    <g transform="translate(150, 400)">
      <rect width="250" height="105" rx="6" fill="#161e1b" stroke="#059669"/>
      <text x="16" y="28" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Asynchronous Work Queues</text>
      <text x="16" y="50" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="11">Decoupled queue buffers batch surges</text>
      <text x="16" y="70" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="11">Auto-retry on transient timeouts</text>
      <text x="16" y="90" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11">100% job execution guarantee</text>
    </g>

    <g transform="translate(440, 400)">
      <rect width="250" height="105" rx="6" fill="#161e1b" stroke="#059669"/>
      <text x="16" y="28" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Dedicated Capacity Allocation</text>
      <text x="16" y="50" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="11">Provisioned throughput guarantees</text>
      <text x="16" y="70" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="11">Zero shared noisy-neighbour stalls</text>
      <text x="16" y="90" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11">Predictable completion SLA</text>
    </g>

    <g transform="translate(730, 400)">
      <rect width="250" height="105" rx="6" fill="#161e1b" stroke="#059669"/>
      <text x="16" y="28" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">End-to-End System Integration</text>
      <text x="16" y="50" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="11">Direct ERP and DB connectors</text>
      <text x="16" y="70" fill="#9ca3af" font-family="system-ui, -apple-system, sans-serif" font-size="11">Audit logs write directly to ledger</text>
      <text x="16" y="90" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11">Continuous operations outcome</text>
    </g>
  </g>
</svg>