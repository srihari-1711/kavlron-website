<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid53" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid53)"/>

  <!-- Trace Path: 4 Systems in the Order Journey -->
  <g transform="translate(80, 160)">
    <!-- Stage 1: Customer PO -->
    <g fill="#141416" stroke="#25252c" stroke-width="1.2">
      <rect width="210" height="240" rx="8"/>
      <text x="20" y="36" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">1. Customer PO</text>
      <text x="20" y="60" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11">Format: PDF / Email</text>
      <rect x="20" y="80" width="170" height="130" fill="#1b1b22" rx="4"/>
      <text x="32" y="105" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="10">SKU: IND-400-B</text>
      <text x="32" y="125" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="10">Qty: 250 Units</text>
      <text x="32" y="145" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="10">Delivery: Warehouse 4</text>
      <text x="32" y="165" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="10">Special: Palletised</text>
    </g>

    <!-- Fracture Point 1 -->
    <g transform="translate(210, 100)">
      <line x1="0" y1="20" x2="60" y2="20" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="30" cy="20" r="12" fill="#261414" stroke="#ef4444"/>
      <text x="26" y="24" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">!</text>
      <text x="30" y="48" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Manual Entry</text>
    </g>

    <!-- Stage 2: ERP Sales Order -->
    <g transform="translate(270, 0)" fill="#141416" stroke="#25252c" stroke-width="1.2">
      <rect width="210" height="240" rx="8"/>
      <text x="20" y="36" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">2. ERP Order Entry</text>
      <text x="20" y="60" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11">System: SAP / NetSuite</text>
      <rect x="20" y="80" width="170" height="130" fill="#1b1b22" rx="4"/>
      <text x="32" y="105" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="10">SKU: IND-400-8 (Typo)</text>
      <text x="32" y="125" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="10">Qty: 25 Cartons (Error)</text>
      <text x="32" y="145" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="10">Delivery: Main HQ</text>
      <text x="32" y="165" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="10">Special: [Omitted]</text>
    </g>

    <!-- Fracture Point 2 -->
    <g transform="translate(480, 100)">
      <line x1="0" y1="20" x2="60" y2="20" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="30" cy="20" r="12" fill="#261414" stroke="#ef4444"/>
      <text x="26" y="24" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">!</text>
      <text x="30" y="48" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="9" text-anchor="middle">Data Sync Gap</text>
    </g>

    <!-- Stage 3: WMS Picking Ticket -->
    <g transform="translate(540, 0)" fill="#141416" stroke="#25252c" stroke-width="1.2">
      <rect width="210" height="240" rx="8"/>
      <text x="20" y="36" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">3. WMS Fulfillment</text>
      <text x="20" y="60" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="11">Warehouse Floor</text>
      <rect x="20" y="80" width="170" height="130" fill="#1b1b22" rx="4"/>
      <text x="32" y="105" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="10">Picks: IND-400-8</text>
      <text x="32" y="125" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="10">Loose boxes packed</text>
      <text x="32" y="145" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="10">No pallet wrap</text>
    </g>

    <!-- Stage 4: Automated Pre-Dispatch Barrier (The Fix) -->
    <g transform="translate(810, 0)">
      <rect width="230" height="240" rx="8" fill="#121a15" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="36" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">4. Connected Verification</text>
      <text x="20" y="60" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="11">Pre-Manifest Triangulation</text>
      
      <g transform="translate(15, 80)">
        <rect width="200" height="135" rx="4" fill="#1a251e" stroke="#059669"/>
        <text x="12" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Auto-Flags Mismatches:</text>
        <text x="12" y="46" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="10">✗ SKU mismatch vs PO</text>
        <text x="12" y="66" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="10">✗ Unit-of-measure conflict</text>
        <text x="12" y="86" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10">✓ Intercepted BEFORE shipping</text>
        <text x="12" y="112" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="9">Zero freight returns, zero credit notes</text>
      </g>
    </g>

    <path d="M 750 120 L 810 120" stroke="#10b981" stroke-width="2"/>
  </g>

  <!-- Bottom Banner: Business Outcome -->
  <g transform="translate(80, 440)" fill="#141416" stroke="#25252c" stroke-width="1">
    <rect width="960" height="60" rx="6"/>
    <text x="30" y="36" fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif" font-size="13">
      <tspan fill="#ef4444" font-weight="600">Traditional Cost:</tspan> Double freight costs, write-downs, client penalties, and credit disputes.
      <tspan fill="#34d399" font-weight="600" dx="20">Solution:</tspan> Automated cross-layer reconciliation between PO, ERP, and dispatch manifests.
    </text>
  </g>
</svg>