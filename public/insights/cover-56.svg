<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid56" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid56)"/>

  <!-- Left: RFP Ingestion & Question Decomposition -->
  <g fill="#141416" stroke="#25252c" stroke-width="1.5">
    <rect x="80" y="140" width="280" height="350" rx="12"/>
    <text x="105" y="178" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Inbound Tender / RFP</text>
    <line x1="80" y1="200" x2="360" y2="200" stroke="#222"/>

    <g transform="translate(100, 220)">
      <rect width="240" height="60" rx="6" fill="#1b1b22"/>
      <text x="14" y="24" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Enterprise Tender Document</text>
      <text x="14" y="44" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="11">140 Questions (Security, SLA, Tech)</text>
    </g>

    <g transform="translate(100, 295)">
      <rect width="240" height="60" rx="6" fill="#1b1b22"/>
      <text x="14" y="24" fill="#eab308" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Deadline Countdown</text>
      <text x="14" y="44" fill="#fde047" font-family="system-ui, -apple-system, sans-serif" font-size="11">7 Business Days to Submission</text>
    </g>

    <g transform="translate(100, 370)">
      <rect width="240" height="95" rx="6" fill="#1b1b22"/>
      <text x="14" y="24" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">The Traditional Failure</text>
      <text x="14" y="44" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="10">• Answers rebuilt from scratch</text>
      <text x="14" y="62" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="10">• Chasing engineers across Slack</text>
      <text x="14" y="80" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="10">• Rushed, unvetted late drafts</text>
    </g>
  </g>

  <!-- Middle: Verified Knowledge Base & Vector Assembly -->
  <g transform="translate(410, 160)">
    <rect width="360" height="310" rx="12" fill="#141724" stroke="#6366f1" stroke-width="1.5"/>
    <text x="24" y="38" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Audited Knowledge Assembly</text>
    <text x="24" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Verified truth library with source citations</text>
    <line x1="24" y1="80" x2="336" y2="80" stroke="#252945"/>

    <g transform="translate(24, 100)">
      <rect width="312" height="48" rx="6" fill="#1b1f33"/>
      <text x="12" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">✓ Security &amp; Compliance (SOC2 / ISO)</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Auto-populates 55 standard data residency questions</text>
    </g>

    <g transform="translate(24, 160)">
      <rect width="312" height="48" rx="6" fill="#1b1f33"/>
      <text x="12" y="22" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">✓ Architecture &amp; SLA Covenants</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Matches current technical specs &amp; commitments</text>
    </g>

    <g transform="translate(24, 220)">
      <rect width="312" height="60" rx="6" fill="#1b1f33"/>
      <text x="12" y="22" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Synthesis &amp; Tone Normalization</text>
      <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Assembles cohesive proposal tailored to client brief</text>
      <text x="12" y="52" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10">80% first draft completed in 20 minutes</text>
    </g>
  </g>

  <!-- Right: Human Expert Verification -->
  <g transform="translate(820, 160)" fill="#141416" stroke="#10b981" stroke-width="1.5">
    <rect width="300" height="310" rx="12"/>
    <text x="24" y="38" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">The Lean Team Advantage</text>
    <line x1="0" y1="58" x2="300" y2="58" stroke="#222"/>

    <g transform="translate(20, 80)">
      <rect width="260" height="60" rx="6" fill="#17221c"/>
      <text x="12" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Review Rather than Write</text>
      <text x="12" y="44" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="11">Subject matter experts polish custom sections</text>
    </g>

    <g transform="translate(20, 155)">
      <rect width="260" height="60" rx="6" fill="#17221c"/>
      <text x="12" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Zero Missed Deadlines</text>
      <text x="12" y="44" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="11">Proposals submitted 48h before cutoff</text>
    </g>

    <g transform="translate(20, 230)">
      <rect width="260" height="55" rx="6" fill="#17221c"/>
      <text x="12" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Commercial Result</text>
      <text x="12" y="44" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11">2x–3x more bids won without extra staff</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 360 315 L 410 315" stroke="#6366f1" stroke-width="2"/>
  <path d="M 770 315 L 820 315" stroke="#10b981" stroke-width="2"/>
</svg>
