<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid60" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid60)"/>

  <!-- Left: Sales Commercial Deal Intake -->
  <g fill="#141416" stroke="#25252c" stroke-width="1.5">
    <rect x="80" y="160" width="280" height="310" rx="10"/>
    <text x="105" y="200" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Sales Negotiation Stage</text>
    <line x1="80" y1="220" x2="360" y2="220" stroke="#222"/>

    <g transform="translate(100, 240)">
      <rect width="240" height="60" rx="6" fill="#1b1b22"/>
      <text x="12" y="24" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Proposal: Enterprise Tier</text>
      <text x="12" y="44" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="10">Base Price: €85,000 / year</text>
    </g>

    <g transform="translate(100, 315)">
      <rect width="240" height="60" rx="6" fill="#241818" stroke="#ef4444"/>
      <text x="12" y="24" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Verbal Promise on Call</text>
      <text x="12" y="44" fill="#fca5a5" font-family="system-ui, -apple-system, sans-serif" font-size="10">"We can do 12% off for 2-year commit"</text>
    </g>

    <g transform="translate(100, 390)">
      <rect width="240" height="60" rx="6" fill="#1b1b22"/>
      <text x="12" y="24" fill="#eab308" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Risk Point: Disconnect</text>
      <text x="12" y="44" fill="#71717a" font-family="system-ui, -apple-system, sans-serif" font-size="10">Never logged in billing master catalog</text>
    </g>
  </g>

  <!-- Middle: Policy & Tolerance Gate -->
  <g transform="translate(400, 180)">
    <rect width="360" height="270" rx="12" fill="#171822" stroke="#6366f1" stroke-width="1.5"/>
    <text x="24" y="38" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Automated Discount Governance</text>
    <text x="24" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Eliminating unapproved margin leakage</text>
    <line x1="24" y1="80" x2="336" y2="80" stroke="#252945"/>

    <g transform="translate(24, 100)">
      <rect width="312" height="45" rx="6" fill="#1b1f33"/>
      <text x="12" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Tier 1: Standard Discretion (&lt; 5%)</text>
      <text x="12" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Auto-approved &amp; bound to quote contract</text>
    </g>

    <g transform="translate(24, 155)">
      <rect width="312" height="45" rx="6" fill="#1b1f33"/>
      <text x="12" y="20" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Tier 2: Commercial Exception (&gt; 5%)</text>
      <text x="12" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Requires commercial director mobile sign-off</text>
    </g>

    <g transform="translate(24, 210)">
      <rect width="312" height="45" rx="6" fill="#1b1f33"/>
      <text x="12" y="20" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Bi-Directional ERP Sync</text>
      <text x="12" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Locks approved rates directly into invoicing</text>
    </g>
  </g>

  <!-- Right: Invoicing Fidelity -->
  <g transform="translate(800, 160)" fill="#141416" stroke="#10b981" stroke-width="1.5">
    <rect width="320" height="310" rx="12"/>
    <text x="24" y="38" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Zero-Drift Invoice Generation</text>
    <line x1="0" y1="58" x2="320" y2="58" stroke="#222"/>

    <g transform="translate(20, 80)">
      <rect width="280" height="60" rx="6" fill="#16221c"/>
      <text x="12" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Invoice Exactly Matches Quote</text>
      <text x="12" y="44" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="10">Promised discount reflected line-for-line</text>
    </g>

    <g transform="translate(20, 155)">
      <rect width="280" height="60" rx="6" fill="#16221c"/>
      <text x="12" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Zero Billing Disputes</text>
      <text x="12" y="44" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="10">Customer pays immediately without delay</text>
    </g>

    <g transform="translate(20, 230)">
      <rect width="280" height="60" rx="6" fill="#16221c"/>
      <text x="12" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Protected Profit Margins</text>
      <text x="12" y="44" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10">No unauthorized off-sheet price cuts</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 360 315 L 400 315" stroke="#6366f1" stroke-width="2"/>
  <path d="M 760 315 L 800 315" stroke="#10b981" stroke-width="2"/>
</svg>
