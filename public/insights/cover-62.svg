<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <pattern id="grid62" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid62)"/>

  <!-- Left: Corporate & Subcontractor Compliance Records -->
  <g fill="#141416" stroke="#25252c" stroke-width="1.5">
    <rect x="80" y="140" width="300" height="350" rx="12"/>
    <text x="105" y="178" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Active Compliance Vault</text>
    <line x1="80" y1="200" x2="380" y2="200" stroke="#222"/>

    <!-- Valid Certificate -->
    <g transform="translate(100, 220)">
      <rect width="260" height="55" rx="6" fill="#141f17" stroke="#059669"/>
      <text x="12" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">ISO 27001 Security Audit</text>
      <text x="12" y="42" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="10">Expires: 14 Months [VALID]</text>
    </g>

    <!-- Impending Expiry: 30 Days -->
    <g transform="translate(100, 290)">
      <rect width="260" height="65" rx="6" fill="#241e14" stroke="#f59e0b"/>
      <text x="12" y="24" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Subcontractor Liability Insurance</text>
      <text x="12" y="42" fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Vendor: Apex Engineering BV</text>
      <text x="12" y="56" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold">EXPIRES IN 28 DAYS</text>
    </g>

    <!-- Critical: Operating License -->
    <g transform="translate(100, 370)">
      <rect width="260" height="65" rx="6" fill="#261616" stroke="#ef4444"/>
      <text x="12" y="24" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Trade Operating Licence (MY)</text>
      <text x="12" y="42" fill="#d4d4d8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Entity: Kalvron Regional Logistics</text>
      <text x="12" y="56" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold">CRITICAL: RENEWAL PENDING</text>
    </g>
  </g>

  <!-- Middle: Continuous Expiry Radar -->
  <g transform="translate(420, 180)">
    <rect width="340" height="270" rx="12" fill="#181824" stroke="#6366f1" stroke-width="1.5"/>
    <text x="24" y="38" fill="#a5b4fc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Standing Expiry Watchtower</text>
    <text x="24" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Watching expiration clocks 24/7</text>
    <line x1="24" y1="80" x2="316" y2="80" stroke="#252945"/>

    <g transform="translate(24, 100)">
      <rect width="292" height="45" rx="6" fill="#1b1f33"/>
      <text x="12" y="20" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Tiered Countdown Cadence</text>
      <text x="12" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Monitors 90, 60, 30, and 14-day horizons</text>
    </g>

    <g transform="translate(24, 155)">
      <rect width="292" height="45" rx="6" fill="#1b1f33"/>
      <text x="12" y="20" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Self-Service Vendor Outreach</text>
      <text x="12" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Dispatches secure document upload link</text>
    </g>

    <g transform="translate(24, 210)">
      <rect width="292" height="45" rx="6" fill="#1b1f33"/>
      <text x="12" y="20" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Automated Dispatch Gatekeeper</text>
      <text x="12" y="36" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Freezes contractor assignment upon lapse</text>
    </g>
  </g>

  <!-- Right: Operational Peace of Mind -->
  <g transform="translate(800, 160)" fill="#141416" stroke="#10b981" stroke-width="1.5">
    <rect width="320" height="310" rx="12"/>
    <text x="24" y="38" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Auditable Operating Protection</text>
    <line x1="0" y1="58" x2="320" y2="58" stroke="#222"/>

    <g transform="translate(20, 80)">
      <rect width="280" height="60" rx="6" fill="#16221c"/>
      <text x="12" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Zero Silent Lapses</text>
      <text x="12" y="44" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="10">No un-insured subcontractor works a job</text>
    </g>

    <g transform="translate(20, 155)">
      <rect width="280" height="60" rx="6" fill="#16221c"/>
      <text x="12" y="24" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Zero Regulatory Fines</text>
      <text x="12" y="44" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-size="10">Operating licences renewed 6 weeks early</text>
    </g>

    <g transform="translate(20, 230)">
      <rect width="280" height="60" rx="6" fill="#16221c"/>
      <text x="12" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Automated Audit Trails</text>
      <text x="12" y="44" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10">Instantly exportable compliance packs</text>
    </g>
  </g>

  <!-- Connectors -->
  <path d="M 380 315 L 420 315" stroke="#6366f1" stroke-width="2"/>
  <path d="M 760 315 L 800 315" stroke="#10b981" stroke-width="2"/>
</svg>
