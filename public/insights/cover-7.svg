<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- Dots Background -->
  <pattern id="dots7" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="2" fill="#222"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dots7)"/>

  <!-- Multi-channel sales funnel / converging radar vectors -->
  <g fill="none" stroke="#333" stroke-width="2">
    <path d="M 180 160 L 600 315 L 1020 160"/>
    <path d="M 180 470 L 600 315 L 1020 470"/>
    <line x1="100" y1="315" x2="1100" y2="315" stroke-dasharray="8 8"/>
    
    <path d="M 280 220 Q 450 315 600 315" stroke="#FFB100" stroke-width="3"/>
    <path d="M 280 410 Q 450 315 600 315" stroke="#888" stroke-width="2"/>
    <path d="M 600 315 L 950 315" stroke="#FFB100" stroke-width="4"/>
  </g>

  <!-- Pulse rings around handoff center -->
  <circle cx="600" cy="315" r="90" fill="none" stroke="#FFB100" stroke-width="1" opacity="0.25"/>
  <circle cx="600" cy="315" r="55" fill="none" stroke="#FFB100" stroke-width="2" opacity="0.5"/>
  <circle cx="600" cy="315" r="24" fill="#0A0A0A" stroke="#FFB100" stroke-width="4"/>

  <!-- Channel Origin & Conversion Nodes -->
  <circle cx="280" cy="220" r="14" fill="#0A0A0A" stroke="#FFB100" stroke-width="3"/>
  <circle cx="280" cy="410" r="14" fill="#0A0A0A" stroke="#888" stroke-width="3"/>
  <circle cx="950" cy="315" r="18" fill="#FFB100"/>
  
  <!-- Floating signals -->
  <circle cx="420" cy="280" r="4" fill="#FFB100"/>
  <circle cx="480" cy="340" r="3" fill="#888"/>
  <circle cx="750" cy="315" r="5" fill="#FFB100"/>
  <circle cx="830" cy="315" r="4" fill="#FFB100" opacity="0.8"/>
</svg>
