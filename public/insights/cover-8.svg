<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- Grid Background -->
  <pattern id="grid8" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1f1f1f" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid8)"/>

  <!-- Decision Branching Tree / Balance Architecture -->
  <g fill="none" stroke="#333" stroke-width="2">
    <!-- Center trunk -->
    <line x1="200" y1="315" x2="420" y2="315" stroke="#888" stroke-width="3"/>

    <!-- Fork top (Automate: circuit / linear precision) -->
    <path d="M 420 315 C 500 315, 520 200, 620 200 L 980 200" stroke="#FFB100" stroke-width="4"/>
    <line x1="620" y1="200" x2="620" y2="130" stroke="#FFB100" stroke-width="2"/>
    <line x1="780" y1="200" x2="780" y2="260" stroke="#FFB100" stroke-width="2"/>

    <!-- Fork bottom (Hire: organic / human connection) -->
    <path d="M 420 315 C 500 315, 520 430, 620 430 L 980 430" stroke="#666" stroke-width="3"/>
    <line x1="620" y1="430" x2="620" y2="500" stroke="#666" stroke-width="2"/>
    <line x1="800" y1="430" x2="800" y2="370" stroke="#666" stroke-width="2"/>
  </g>

  <!-- Decision Junction Node -->
  <circle cx="420" cy="315" r="28" fill="#141414" stroke="#FFB100" stroke-width="3"/>
  <circle cx="420" cy="315" r="10" fill="#FFB100"/>

  <!-- Automate Branch Nodes -->
  <circle cx="620" cy="200" r="14" fill="#0A0A0A" stroke="#FFB100" stroke-width="3"/>
  <circle cx="620" cy="130" r="8" fill="#FFB100"/>
  <circle cx="780" cy="200" r="12" fill="#0A0A0A" stroke="#FFB100" stroke-width="3"/>
  <circle cx="780" cy="260" r="6" fill="#FFB100"/>
  <circle cx="980" cy="200" r="18" fill="#FFB100"/>

  <!-- Hire Branch Nodes -->
  <circle cx="620" cy="430" r="14" fill="#0A0A0A" stroke="#888" stroke-width="3"/>
  <circle cx="620" cy="500" r="8" fill="#888"/>
  <circle cx="800" cy="430" r="12" fill="#0A0A0A" stroke="#888" stroke-width="3"/>
  <circle cx="800" cy="370" r="6" fill="#888"/>
  <circle cx="980" cy="430" r="16" fill="#0A0A0A" stroke="#888" stroke-width="3"/>

  <!-- Origin Node -->
  <circle cx="200" cy="315" r="16" fill="#0A0A0A" stroke="#888" stroke-width="3"/>
</svg>

