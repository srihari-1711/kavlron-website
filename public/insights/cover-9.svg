<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0A0A0A"/>
  
  <!-- Grid -->
  <pattern id="grid9" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1f1f1f" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid9)"/>

  <!-- Tiered Architectural Strata -->
  <g fill="none" stroke-linecap="round">
    <!-- Layer 1: Context & Integrations (Base) -->
    <path d="M 200 480 L 1000 480" stroke="#333" stroke-width="4"/>
    <path d="M 260 480 L 300 430 L 900 430 L 940 480" stroke="#444" stroke-width="2"/>
    
    <!-- Layer 2: Persistence & Audit Log -->
    <path d="M 240 370 L 960 370" stroke="#555" stroke-width="3" stroke-dasharray="8 6"/>
    
    <!-- Layer 3: Agent Orchestration Core -->
    <path d="M 180 260 L 1020 260" stroke="#FFB100" stroke-width="4"/>
    <path d="M 400 260 C 400 170, 800 170, 800 260" stroke="#FFB100" stroke-width="2" opacity="0.6"/>

    <!-- Vertical Coordination Channels -->
    <line x1="350" y1="260" x2="350" y2="480" stroke="#444" stroke-width="2"/>
    <line x1="600" y1="170" x2="600" y2="480" stroke="#FFB100" stroke-width="2"/>
    <line x1="850" y1="260" x2="850" y2="480" stroke="#444" stroke-width="2"/>
  </g>

  <!-- Node Junctions -->
  <g fill="#0A0A0A" stroke="#FFB100" stroke-width="3">
    <circle cx="600" cy="170" r="16" fill="#FFB100"/>
    <circle cx="600" cy="260" r="22"/>
    <circle cx="350" cy="260" r="14"/>
    <circle cx="850" cy="260" r="14"/>
  </g>

  <g fill="#141414" stroke="#888" stroke-width="2">
    <circle cx="350" cy="370" r="10"/>
    <circle cx="600" cy="370" r="12" stroke="#FFB100"/>
    <circle cx="850" cy="370" r="10"/>
    <circle cx="350" cy="480" r="12"/>
    <circle cx="600" cy="480" r="14" stroke="#FFB100"/>
    <circle cx="850" cy="480" r="12"/>
  </g>

  <!-- Accent Signals -->
  <circle cx="500" cy="260" r="4" fill="#FFB100"/>
  <circle cx="700" cy="260" r="4" fill="#FFB100"/>
  <circle cx="600" cy="315" r="5" fill="#FFB100" opacity="0.7"/>
</svg>

